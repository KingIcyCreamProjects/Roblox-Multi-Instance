name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      skip_checks:
        description: "Build without running the checks first (only when they already passed for this commit)"
        type: boolean
        default: false

jobs:
  check:
    if: ${{ !inputs.skip_checks }}
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    # after the checks pass, or when they were skipped on purpose from the Actions tab
    if: ${{ !cancelled() && (needs.check.result == 'success' || needs.check.result == 'skipped') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # One OS at a time: each tauri-action run downloads latest.json, adds its platforms,
      # deletes the asset and uploads its copy, so parallel runs can drop a platform (and can
      # race to create duplicate draft releases).
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          conf=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          [ "${GITHUB_REF_NAME#v}" = "$conf" ] || { echo "tag $GITHUB_REF_NAME != tauri.conf.json $conf"; exit 1; }
          # the About page and What's new log read the Cargo.toml version
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          pkg=$(node -p 'require("./package.json").version')
          [ "$cargo" = "$conf" ] || { echo "Cargo.toml $cargo != tauri.conf.json $conf"; exit 1; }
          [ "$pkg" = "$conf" ] || { echo "package.json $pkg != tauri.conf.json $conf"; exit 1; }

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev xdg-utils

      - uses: dtolnay/rust-toolchain@1.99.1 # pinned: a new Rust release must not break clippy -D warnings on a tag
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      # Windows builds MSI + NSIS, macOS a universal DMG, Linux AppImage + deb
      # (bundle.targets = "all"). latest.json is uploaded when
      # bundle.createUpdaterArtifacts is true and the signing secrets are set.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Roblox Multi Instance v__VERSION__"
          releaseBody: "See the assets below to download and install."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
