[package]
name = "roblox-multi-instance"
version = "1.0.0"
description = "Roblox Multi Instance: personal multi-account manager for Roblox"
authors = ["KingIcyCreamProjects"]
license = "MIT"
edition = "2021"

[lib]
name = "rmi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
arboard = { version = "3", default-features = false }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
regex = "1"
dirs = "6"
thiserror = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio = { version = "1", features = ["net", "sync", "macros", "time", "io-util"] }
tower = { version = "0.5", features = ["limit", "timeout"] }
subtle = "2"
async-trait = "0.1"
getrandom = "0.3"
crypto_secretbox = "0.1.1"
sha2 = "0.11.1"
url = "2.5.8"
chacha20poly1305 = "0.10"
argon2 = { version = "0.6.0", features = ["zeroize"] }
base64 = "0.23.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
zeroize = { version = "1.9.1", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-util = "0.7"
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
jpeg-encoder = { version = "0.7", features = ["simd"] }
fast_image_resize = "6"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
tokio-tungstenite = "0.28"
axum = "0.8"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(not(windows))".dependencies]
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
core-foundation = "0.10"
enigo = { version = "0.6", default-features = false }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
xcap = { version = "0.9", default-features = false }

[target."cfg(windows)".dependencies]
cpal = "0.18.2"
windows = { version = "0.62.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_System_RemoteDesktop", "Win32_System_WinRT", "Security_Credentials_UI", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }
windows-future = "0.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Wdk_System_Threading", "Win32_System_StationsAndDesktops", "Win32_System_Shutdown"] }
